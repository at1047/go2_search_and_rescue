amcl:  # not used with SLAM, but keep section empty or remove for now
  ros__parameters: {}

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      # Basic dynamic obstacle responsiveness (tune later)
      max_vel_x: 0.5
      min_vel_x: 0.0
      max_vel_theta: 1.5
      acc_lim_x: 0.5
      acc_lim_theta: 1.5
      sim_time: 2.0

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5

recoveries_server:
  ros__parameters:
    use_sim_time: false

behavior_server:
  ros__parameters:
    use_sim_time: false

map_server:  # not used with online SLAM, but Nav2 wants section
  ros__parameters: {}

waypoint_follower:
  ros__parameters:
    use_sim_time: false

# ---------- COSTMAPS (this is the important part) ----------

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map            # from SLAM Toolbox
      robot_base_frame: base_link
      resolution: 0.05
      publish_frequency: 5.0
      update_frequency: 10.0
      rolling_window: false
      width: 50.0
      height: 50.0

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true          # <--- needed for dynamic obstacles
          marking: true
          data_type: "LaserScan"
          obstacle_range: 6.0
          raytrace_range: 8.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom          # local frame = odom
      robot_base_frame: base_link
      resolution: 0.05
      publish_frequency: 5.0
      update_frequency: 10.0
      rolling_window: true
      width: 10.0
      height: 10.0

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true          # <--- clears moving obstacles
          marking: true
          data_type: "LaserScan"
          obstacle_range: 6.0
          raytrace_range: 8.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5
        cost_scaling_factor: 3.0

