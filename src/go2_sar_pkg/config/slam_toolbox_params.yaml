slam_toolbox:
  ros__parameters:
    use_sim_time: false

    # Modes: "mapping", "localization", "lifecycle"
    mode: "mapping"

    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scanner/scan

    # How often to publish map->odom
    transform_publish_period: 0.02  # 50 Hz

    # Map settings
    resolution: 0.05
    map_update_interval: 2.0
    max_laser_range: 10.0
    minimum_time_interval: 0.1

